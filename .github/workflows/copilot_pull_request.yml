name: Copilot - Pull Request

on:
  pull_request:
    types: [opened, reopened, edited, closed, synchronize]

jobs:
  copilot-pull-requests:
    if: ${{ vars.COPILOT_BOT_LOGIN == '' || github.actor != vars.COPILOT_BOT_LOGIN }}
    name: Copilot - Pull Request
    runs-on: [self-hosted, codex]
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Fetch incremental review range
        if: github.event.action == 'synchronize'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          git fetch --no-tags --depth=1 origin "$AFTER_SHA"
          if ! git fetch --no-tags --depth=1 origin "$BEFORE_SHA"; then
            echo "::notice::The previous PR commit is unavailable; Bugbot will use the canonical pull-request diff."
          fi

      - uses: ./
        with:
          ai-ignore-files: build/*
          debug: ${{ vars.DEBUG }}
          agent-provider: ${{ vars.AGENT_PROVIDER || 'codex' }}
          agent-model-provider: ${{ vars.AGENT_MODEL_PROVIDER || 'openai' }}
          agent-model: ${{ vars.AGENT_MODEL || 'gpt-5.6-luna' }}
          agent-effort: ${{ vars.AGENT_EFFORT }}
          agent-command: ${{ vars.AGENT_COMMAND }}
          findings-provider: ${{ vars.FINDINGS_PROVIDER }}
          findings-model-provider: ${{ vars.FINDINGS_MODEL_PROVIDER }}
          findings-model: ${{ vars.FINDINGS_MODEL }}
          findings-effort: ${{ vars.FINDINGS_EFFORT }}
          findings-command: ${{ vars.FINDINGS_COMMAND }}
          fixer-provider: ${{ vars.FIXER_PROVIDER }}
          fixer-model-provider: ${{ vars.FIXER_MODEL_PROVIDER }}
          fixer-model: ${{ vars.FIXER_MODEL }}
          fixer-effort: ${{ vars.FIXER_EFFORT }}
          fixer-command: ${{ vars.FIXER_COMMAND }}
          reviewer-provider: ${{ vars.REVIEWER_PROVIDER }}
          reviewer-model-provider: ${{ vars.REVIEWER_MODEL_PROVIDER }}
          reviewer-model: ${{ vars.REVIEWER_MODEL }}
          reviewer-effort: ${{ vars.REVIEWER_EFFORT }}
          reviewer-command: ${{ vars.REVIEWER_COMMAND }}
          project-ids: ${{ vars.PROJECT_IDS }}
          token: ${{ secrets.PAT }}
        env:
          AGENT_PROVIDER: ${{ vars.AGENT_PROVIDER || 'codex' }}
          AGENT_MODEL_PROVIDER: ${{ vars.AGENT_MODEL_PROVIDER || 'openai' }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_EFFORT: ${{ vars.AGENT_EFFORT }}
          AGENT_PROVISIONING: ${{ vars.AGENT_PROVISIONING || 'auto' }}
          AGENT_ALLOWED_MODEL_PROVIDERS: ${{ vars.AGENT_ALLOWED_MODEL_PROVIDERS || 'openai' }}
          AGENT_ALLOWED_MODELS: ${{ vars.AGENT_ALLOWED_MODELS || 'openai/gpt-5.6-luna' }}
          AGENT_COMMAND: ${{ vars.AGENT_COMMAND }}
          CODEX_VERSION: ${{ vars.CODEX_VERSION }}
          OPENCODE_VERSION: ${{ vars.OPENCODE_VERSION }}
          CURSOR_INSTALLER_SHA256: ${{ vars.CURSOR_INSTALLER_SHA256 }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CURSOR_API_KEY: ${{ (vars.AGENT_PROVIDER == 'cursor' || vars.FINDINGS_PROVIDER == 'cursor' || vars.FIXER_PROVIDER == 'cursor' || vars.PLANNER_PROVIDER == 'cursor' || vars.REVIEWER_PROVIDER == 'cursor' || vars.TESTER_PROVIDER == 'cursor' || vars.RELEASE_PROVIDER == 'cursor') && secrets.CURSOR_API_KEY || '' }}
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          COPILOT_EVIDENCE_TOKEN: ${{ github.token }}
