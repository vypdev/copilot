          TMP: ${{ steps.verification_continue_9.outputs.verification-tmp }}
          TEMP: ${{ steps.verification_continue_9.outputs.verification-temp }}
          TMPDIR: ${{ steps.verification_continue_9.outputs.verification-tmpdir }}
      - name: Continue repository verification 10
        id: verification_continue_10
        if: ${{ always() && steps.verification_continue_9.outputs.verification-setup-pending == 'true' }}
        uses: ./
        with: *copilot-inputs
        env:
          COPILOT_NATIVE_PHASE: continue
          COPILOT_NATIVE_TICKET: ${{ steps.copilot.outputs.verification-ticket }}
          COPILOT_NATIVE_REQUEST: ${{ steps.verification_continue_9.outputs.verification-request }}
          COPILOT_NATIVE_OUTCOME: ${{ steps.verification_setup_10.outcome }}
      - name: Prepare repository verification 11
        id: verification_setup_11
        if: ${{ !cancelled() && steps.verification_continue_10.outcome == 'success' && steps.verification_continue_10.outputs.verification-setup-pending == 'true' }}
