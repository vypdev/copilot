name: Copilot - Issue Comment

on:
  issue_comment:
    types: [created, edited]

jobs:
  copilot-issues:
    if: ${{ vars.COPILOT_BOT_LOGIN == '' || github.actor != vars.COPILOT_BOT_LOGIN }}
    name: Copilot - Issue Comment
    runs-on: [self-hosted, codex, Linux]
    timeout-minutes: 120
    permissions:
      checks: write
      contents: read
    env:
      # Preparation covers parser whitespace and mentions; authorization stays in the Action.
      COPILOT_PREPARE_VERIFICATION: ${{ vars.BUGBOT_AUTOFIX_VERIFY_COMMANDS != '' && ((contains(github.event.comment.body, '/copilot') && ((contains(github.event.comment.body, 'sync-branch') && !contains(github.event.comment.body, '--dry-run')) || contains(github.event.comment.body, 'implement') || contains(github.event.comment.body, 'fix') || contains(github.event.comment.body, 'remember'))) || (vars.COPILOT_BOT_LOGIN != '' && contains(github.event.comment.body, format('@{0}', vars.COPILOT_BOT_LOGIN)) && !contains(github.event.comment.body, '--dry-run'))) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare repository pnpm
        if: env.COPILOT_PREPARE_VERIFICATION == 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 10.12.4
          standalone: false
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - name: Prepare repository Node
        if: env.COPILOT_PREPARE_VERIFICATION == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install repository verification dependencies
        if: env.COPILOT_PREPARE_VERIFICATION == 'true'
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: ./
        id: copilot
        with: &copilot-inputs
          repository-locale: ${{ vars.REPOSITORY_LOCALE || 'en-US' }}
          issues-locale: ${{ vars.ISSUES_LOCALE || '' }}
          pull-requests-locale: ${{ vars.PULL_REQUESTS_LOCALE || '' }}
          issue-workflow-profile: ${{ vars.COPILOT_ISSUE_WORKFLOW_PROFILE || '' }}
          issue-managed-branches: true
          pre-branch-sdd: true
          verification-setup: ${{ vars.VERIFICATION_SETUP || 'false' }}
          ai-ignore-files: build/*,specs/CATALOG.md
          debug: ${{ vars.DEBUG }}
          agent-provider: ${{ vars.AGENT_PROVIDER || 'codex' }}
          agent-model-provider: ${{ vars.AGENT_MODEL_PROVIDER || 'openai' }}
          agent-model: ${{ vars.AGENT_MODEL || 'gpt-6-luna' }}
          agent-effort: ${{ vars.AGENT_EFFORT }}
          agent-executable: ${{ vars.AGENT_EXECUTABLE }}
          findings-provider: ${{ vars.FINDINGS_PROVIDER }}
          findings-model-provider: ${{ vars.FINDINGS_MODEL_PROVIDER }}
          findings-model: ${{ vars.FINDINGS_MODEL }}
          findings-effort: ${{ vars.FINDINGS_EFFORT }}
          findings-executable: ${{ vars.FINDINGS_EXECUTABLE }}
          fixer-provider: ${{ vars.FIXER_PROVIDER }}
          fixer-model-provider: ${{ vars.FIXER_MODEL_PROVIDER }}
          fixer-model: ${{ vars.FIXER_MODEL }}
          fixer-effort: ${{ vars.FIXER_EFFORT }}
          fixer-executable: ${{ vars.FIXER_EXECUTABLE }}
          planner-provider: ${{ vars.PLANNER_PROVIDER }}
          planner-model-provider: ${{ vars.PLANNER_MODEL_PROVIDER }}
          planner-model: ${{ vars.PLANNER_MODEL }}
          planner-effort: ${{ vars.PLANNER_EFFORT }}
          planner-executable: ${{ vars.PLANNER_EXECUTABLE }}
          reviewer-provider: ${{ vars.REVIEWER_PROVIDER }}
          reviewer-model-provider: ${{ vars.REVIEWER_MODEL_PROVIDER }}
          reviewer-model: ${{ vars.REVIEWER_MODEL }}
          reviewer-effort: ${{ vars.REVIEWER_EFFORT }}
          reviewer-executable: ${{ vars.REVIEWER_EXECUTABLE }}
          tester-provider: ${{ vars.TESTER_PROVIDER }}
          tester-model-provider: ${{ vars.TESTER_MODEL_PROVIDER }}
          tester-model: ${{ vars.TESTER_MODEL }}
          tester-effort: ${{ vars.TESTER_EFFORT }}
          tester-executable: ${{ vars.TESTER_EXECUTABLE }}
          project-ids: ${{ vars.PROJECT_IDS }}
          token: ${{ secrets.PAT }}
          bugbot-fix-verify-commands: ${{ vars.BUGBOT_AUTOFIX_VERIFY_COMMANDS }}
          bugbot-dry-run: ${{ vars.BUGBOT_DRY_RUN || 'false' }}
          bugbot-effort: ${{ vars.BUGBOT_EFFORT || 'smart' }}
          bugbot-review-drafts: ${{ vars.BUGBOT_REVIEW_DRAFTS || 'false' }}
          bugbot-trace-rules: ${{ vars.BUGBOT_TRACE_RULES || 'false' }}
          bugbot-suggested-changes: ${{ vars.BUGBOT_SUGGESTED_CHANGES || 'true' }}
          bugbot-telemetry: ${{ vars.BUGBOT_TELEMETRY || 'true' }}
          bugbot-fail-on-unresolved: ${{ vars.BUGBOT_FAIL_ON_UNRESOLVED || 'false' }}
          bugbot-organization-rules: ${{ vars.BUGBOT_ORGANIZATION_RULES }}
        env:
          COPILOT_NATIVE_PHASE: prepare
          AGENT_PROVIDER: ${{ vars.AGENT_PROVIDER || 'codex' }}
          AGENT_MODEL_PROVIDER: ${{ vars.AGENT_MODEL_PROVIDER || 'openai' }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_EFFORT: ${{ vars.AGENT_EFFORT }}
          AGENT_ALLOWED_MODEL_PROVIDERS: ${{ vars.AGENT_ALLOWED_MODEL_PROVIDERS || 'openai' }}
          AGENT_ALLOWED_MODELS: ${{ vars.AGENT_ALLOWED_MODELS || 'openai/gpt-6-luna' }}
          AGENT_EXECUTABLE: ${{ vars.AGENT_EXECUTABLE }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CURSOR_API_KEY: ${{ (vars.AGENT_PROVIDER == 'cursor' || vars.FINDINGS_PROVIDER == 'cursor' || vars.FIXER_PROVIDER == 'cursor' || vars.PLANNER_PROVIDER == 'cursor' || vars.REVIEWER_PROVIDER == 'cursor' || vars.TESTER_PROVIDER == 'cursor') && secrets.CURSOR_API_KEY || '' }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          COPILOT_EVIDENCE_TOKEN: ${{ github.token }}

      # copilot:native-verification:start
      - name: Prepare repository verification 1
        id: verification_setup_1
        if: ${{ !cancelled() && steps.copilot.outcome == 'success' && steps.copilot.outputs.verification-setup-pending == 'true' }}
        uses: ./.github/actions/copilot-verification-setup
        timeout-minutes: 5
        env:
          HOME: ${{ steps.copilot.outputs.verification-home }}
          USERPROFILE: ${{ steps.copilot.outputs.verification-userprofile }}
          APPDATA: ${{ steps.copilot.outputs.verification-appdata }}
          LOCALAPPDATA: ${{ steps.copilot.outputs.verification-localappdata }}
          PATH: ${{ steps.copilot.outputs.verification-path }}
          JAVA_HOME: ${{ steps.copilot.outputs.verification-java_home }}
          TMP: ${{ steps.copilot.outputs.verification-tmp }}
          TEMP: ${{ steps.copilot.outputs.verification-temp }}
          TMPDIR: ${{ steps.copilot.outputs.verification-tmpdir }}
      - name: Continue repository verification 1
        id: verification_continue_1
        if: ${{ always() && steps.copilot.outputs.verification-setup-pending == 'true' }}
        uses: ./
        with: *copilot-inputs
        env:
          COPILOT_NATIVE_PHASE: continue
          COPILOT_NATIVE_TICKET: ${{ steps.copilot.outputs.verification-ticket }}
          COPILOT_NATIVE_REQUEST: ${{ steps.copilot.outputs.verification-request }}
          COPILOT_NATIVE_OUTCOME: ${{ steps.verification_setup_1.outcome }}
      - name: Prepare repository verification 2
        id: verification_setup_2
        if: ${{ !cancelled() && steps.verification_continue_1.outcome == 'success' && steps.verification_continue_1.outputs.verification-setup-pending == 'true' }}
        uses: ./.github/actions/copilot-verification-setup
        timeout-minutes: 5
        env:
          HOME: ${{ steps.verification_continue_1.outputs.verification-home }}
          USERPROFILE: ${{ steps.verification_continue_1.outputs.verification-userprofile }}
          APPDATA: ${{ steps.verification_continue_1.outputs.verification-appdata }}
          LOCALAPPDATA: ${{ steps.verification_continue_1.outputs.verification-localappdata }}
          PATH: ${{ steps.verification_continue_1.outputs.verification-path }}
          JAVA_HOME: ${{ steps.verification_continue_1.outputs.verification-java_home }}
          TMP: ${{ steps.verification_continue_1.outputs.verification-tmp }}
          TEMP: ${{ steps.verification_continue_1.outputs.verification-temp }}
          TMPDIR: ${{ steps.verification_continue_1.outputs.verification-tmpdir }}
      - name: Continue repository verification 2
        id: verification_continue_2
        if: ${{ always() && steps.verification_continue_1.outputs.verification-setup-pending == 'true' }}
        uses: ./
        with: *copilot-inputs
        env:
          COPILOT_NATIVE_PHASE: continue
          COPILOT_NATIVE_TICKET: ${{ steps.copilot.outputs.verification-ticket }}
          COPILOT_NATIVE_REQUEST: ${{ steps.verification_continue_1.outputs.verification-request }}
          COPILOT_NATIVE_OUTCOME: ${{ steps.verification_setup_2.outcome }}
      - name: Prepare repository verification 3
        id: verification_setup_3
        if: ${{ !cancelled() && steps.verification_continue_2.outcome == 'success' && steps.verification_continue_2.outputs.verification-setup-pending == 'true' }}
        uses: ./.github/actions/copilot-verification-setup
        timeout-minutes: 5
        env:
          HOME: ${{ steps.verification_continue_2.outputs.verification-home }}
          USERPROFILE: ${{ steps.verification_continue_2.outputs.verification-userprofile }}
          APPDATA: ${{ steps.verification_continue_2.outputs.verification-appdata }}
          LOCALAPPDATA: ${{ steps.verification_continue_2.outputs.verification-localappdata }}
          PATH: ${{ steps.verification_continue_2.outputs.verification-path }}
          JAVA_HOME: ${{ steps.verification_continue_2.outputs.verification-java_home }}
          TMP: ${{ steps.verification_continue_2.outputs.verification-tmp }}
          TEMP: ${{ steps.verification_continue_2.outputs.verification-temp }}
          TMPDIR: ${{ steps.verification_continue_2.outputs.verification-tmpdir }}
      - name: Continue repository verification 3
        id: verification_continue_3
        if: ${{ always() && steps.verification_continue_2.outputs.verification-setup-pending == 'true' }}
        uses: ./
        with: *copilot-inputs
        env:
          COPILOT_NATIVE_PHASE: continue
          COPILOT_NATIVE_TICKET: ${{ steps.copilot.outputs.verification-ticket }}
          COPILOT_NATIVE_REQUEST: ${{ steps.verification_continue_2.outputs.verification-request }}
          COPILOT_NATIVE_OUTCOME: ${{ steps.verification_setup_3.outcome }}
      - name: Prepare repository verification 4
        id: verification_setup_4
        if: ${{ !cancelled() && steps.verification_continue_3.outcome == 'success' && steps.verification_continue_3.outputs.verification-setup-pending == 'true' }}
        uses: ./.github/actions/copilot-verification-setup
        timeout-minutes: 5
        env:
          HOME: ${{ steps.verification_continue_3.outputs.verification-home }}
          USERPROFILE: ${{ steps.verification_continue_3.outputs.verification-userprofile }}
          APPDATA: ${{ steps.verification_continue_3.outputs.verification-appdata }}
          LOCALAPPDATA: ${{ steps.verification_continue_3.outputs.verification-localappdata }}
          PATH: ${{ steps.verification_continue_3.outputs.verification-path }}
          JAVA_HOME: ${{ steps.verification_continue_3.outputs.verification-java_home }}
          TMP: ${{ steps.verification_continue_3.outputs.verification-tmp }}
          TEMP: ${{ steps.verification_continue_3.outputs.verification-temp }}
          TMPDIR: ${{ steps.verification_continue_3.outputs.verification-tmpdir }}
      - name: Continue repository verification 4
        id: verification_continue_4
        if: ${{ always() && steps.verification_continue_3.outputs.verification-setup-pending == 'true' }}
        uses: ./
        with: *copilot-inputs
        env:
          COPILOT_NATIVE_PHASE: continue
          COPILOT_NATIVE_TICKET: ${{ steps.copilot.outputs.verification-ticket }}
          COPILOT_NATIVE_REQUEST: ${{ steps.verification_continue_3.outputs.verification-request }}
          COPILOT_NATIVE_OUTCOME: ${{ steps.verification_setup_4.outcome }}
      - name: Prepare repository verification 5
        id: verification_setup_5
        if: ${{ !cancelled() && steps.verification_continue_4.outcome == 'success' && steps.verification_continue_4.outputs.verification-setup-pending == 'true' }}
        uses: ./.github/actions/copilot-verification-setup
        timeout-minutes: 5
        env:
          HOME: ${{ steps.verification_continue_4.outputs.verification-home }}
          USERPROFILE: ${{ steps.verification_continue_4.outputs.verification-userprofile }}
          APPDATA: ${{ steps.verification_continue_4.outputs.verification-appdata }}
          LOCALAPPDATA: ${{ steps.verification_continue_4.outputs.verification-localappdata }}
          PATH: ${{ steps.verification_continue_4.outputs.verification-path }}
          JAVA_HOME: ${{ steps.verification_continue_4.outputs.verification-java_home }}
          TMP: ${{ steps.verification_continue_4.outputs.verification-tmp }}
          TEMP: ${{ steps.verification_continue_4.outputs.verification-temp }}
          TMPDIR: ${{ steps.verification_continue_4.outputs.verification-tmpdir }}
      - name: Continue repository verification 5
        id: verification_continue_5
        if: ${{ always() && steps.verification_continue_4.outputs.verification-setup-pending == 'true' }}
        uses: ./
        with: *copilot-inputs
        env:
          COPILOT_NATIVE_PHASE: continue
          COPILOT_NATIVE_TICKET: ${{ steps.copilot.outputs.verification-ticket }}
          COPILOT_NATIVE_REQUEST: ${{ steps.verification_continue_4.outputs.verification-request }}
          COPILOT_NATIVE_OUTCOME: ${{ steps.verification_setup_5.outcome }}
      - name: Prepare repository verification 6
        id: verification_setup_6
        if: ${{ !cancelled() && steps.verification_continue_5.outcome == 'success' && steps.verification_continue_5.outputs.verification-setup-pending == 'true' }}
        uses: ./.github/actions/copilot-verification-setup
        timeout-minutes: 5
        env:
          HOME: ${{ steps.verification_continue_5.outputs.verification-home }}
          USERPROFILE: ${{ steps.verification_continue_5.outputs.verification-userprofile }}
          APPDATA: ${{ steps.verification_continue_5.outputs.verification-appdata }}
          LOCALAPPDATA: ${{ steps.verification_continue_5.outputs.verification-localappdata }}
          PATH: ${{ steps.verification_continue_5.outputs.verification-path }}
          JAVA_HOME: ${{ steps.verification_continue_5.outputs.verification-java_home }}
          TMP: ${{ steps.verification_continue_5.outputs.verification-tmp }}
          TEMP: ${{ steps.verification_continue_5.outputs.verification-temp }}
          TMPDIR: ${{ steps.verification_continue_5.outputs.verification-tmpdir }}
      - name: Continue repository verification 6
        id: verification_continue_6
        if: ${{ always() && steps.verification_continue_5.outputs.verification-setup-pending == 'true' }}
        uses: ./
        with: *copilot-inputs
        env:
          COPILOT_NATIVE_PHASE: continue
          COPILOT_NATIVE_TICKET: ${{ steps.copilot.outputs.verification-ticket }}
          COPILOT_NATIVE_REQUEST: ${{ steps.verification_continue_5.outputs.verification-request }}
          COPILOT_NATIVE_OUTCOME: ${{ steps.verification_setup_6.outcome }}
      - name: Prepare repository verification 7
        id: verification_setup_7
        if: ${{ !cancelled() && steps.verification_continue_6.outcome == 'success' && steps.verification_continue_6.outputs.verification-setup-pending == 'true' }}
        uses: ./.github/actions/copilot-verification-setup
        timeout-minutes: 5
        env:
