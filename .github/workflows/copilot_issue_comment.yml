          USERPROFILE: ${{ steps.verification_continue_6.outputs.verification-userprofile }}
          APPDATA: ${{ steps.verification_continue_6.outputs.verification-appdata }}
          LOCALAPPDATA: ${{ steps.verification_continue_6.outputs.verification-localappdata }}
          PATH: ${{ steps.verification_continue_6.outputs.verification-path }}
          JAVA_HOME: ${{ steps.verification_continue_6.outputs.verification-java_home }}
          TMP: ${{ steps.verification_continue_6.outputs.verification-tmp }}
          TEMP: ${{ steps.verification_continue_6.outputs.verification-temp }}
          TMPDIR: ${{ steps.verification_continue_6.outputs.verification-tmpdir }}
      - name: Continue repository verification 7
        id: verification_continue_7
        if: ${{ always() && steps.verification_continue_6.outputs.verification-setup-pending == 'true' }}
        uses: ./
        with: *copilot-inputs
        env:
          COPILOT_NATIVE_PHASE: continue
          COPILOT_NATIVE_TICKET: ${{ steps.copilot.outputs.verification-ticket }}
          COPILOT_NATIVE_REQUEST: ${{ steps.verification_continue_6.outputs.verification-request }}
          COPILOT_NATIVE_OUTCOME: ${{ steps.verification_setup_7.outcome }}
      - name: Prepare repository verification 8
        id: verification_setup_8
        if: ${{ !cancelled() && steps.verification_continue_7.outcome == 'success' && steps.verification_continue_7.outputs.verification-setup-pending == 'true' }}
        uses: ./.github/actions/copilot-verification-setup
        timeout-minutes: 5
        env:
          HOME: ${{ steps.verification_continue_7.outputs.verification-home }}
          USERPROFILE: ${{ steps.verification_continue_7.outputs.verification-userprofile }}
          APPDATA: ${{ steps.verification_continue_7.outputs.verification-appdata }}
          LOCALAPPDATA: ${{ steps.verification_continue_7.outputs.verification-localappdata }}
          PATH: ${{ steps.verification_continue_7.outputs.verification-path }}
          JAVA_HOME: ${{ steps.verification_continue_7.outputs.verification-java_home }}
          TMP: ${{ steps.verification_continue_7.outputs.verification-tmp }}
          TEMP: ${{ steps.verification_continue_7.outputs.verification-temp }}
          TMPDIR: ${{ steps.verification_continue_7.outputs.verification-tmpdir }}
      - name: Continue repository verification 8
        id: verification_continue_8
        if: ${{ always() && steps.verification_continue_7.outputs.verification-setup-pending == 'true' }}
        uses: ./
        with: *copilot-inputs
        env:
          COPILOT_NATIVE_PHASE: continue
          COPILOT_NATIVE_TICKET: ${{ steps.copilot.outputs.verification-ticket }}
          COPILOT_NATIVE_REQUEST: ${{ steps.verification_continue_7.outputs.verification-request }}
          COPILOT_NATIVE_OUTCOME: ${{ steps.verification_setup_8.outcome }}
      - name: Prepare repository verification 9
        id: verification_setup_9
        if: ${{ !cancelled() && steps.verification_continue_8.outcome == 'success' && steps.verification_continue_8.outputs.verification-setup-pending == 'true' }}
        uses: ./.github/actions/copilot-verification-setup
        timeout-minutes: 5
        env:
          HOME: ${{ steps.verification_continue_8.outputs.verification-home }}
          USERPROFILE: ${{ steps.verification_continue_8.outputs.verification-userprofile }}
          APPDATA: ${{ steps.verification_continue_8.outputs.verification-appdata }}
          LOCALAPPDATA: ${{ steps.verification_continue_8.outputs.verification-localappdata }}
          PATH: ${{ steps.verification_continue_8.outputs.verification-path }}
          JAVA_HOME: ${{ steps.verification_continue_8.outputs.verification-java_home }}
          TMP: ${{ steps.verification_continue_8.outputs.verification-tmp }}
          TEMP: ${{ steps.verification_continue_8.outputs.verification-temp }}
          TMPDIR: ${{ steps.verification_continue_8.outputs.verification-tmpdir }}
      - name: Continue repository verification 9
        id: verification_continue_9
        if: ${{ always() && steps.verification_continue_8.outputs.verification-setup-pending == 'true' }}
        uses: ./
        with: *copilot-inputs
        env:
          COPILOT_NATIVE_PHASE: continue
          COPILOT_NATIVE_TICKET: ${{ steps.copilot.outputs.verification-ticket }}
          COPILOT_NATIVE_REQUEST: ${{ steps.verification_continue_8.outputs.verification-request }}
          COPILOT_NATIVE_OUTCOME: ${{ steps.verification_setup_9.outcome }}
      - name: Prepare repository verification 10
        id: verification_setup_10
        if: ${{ !cancelled() && steps.verification_continue_9.outcome == 'success' && steps.verification_continue_9.outputs.verification-setup-pending == 'true' }}
        uses: ./.github/actions/copilot-verification-setup
        timeout-minutes: 5
        env:
