name: Copilot - Issue Comment
'on':
  issue_comment:
    types:
      - created
      - edited
jobs:
  copilot-issues:
    if: ${{ vars.COPILOT_BOT_LOGIN == '' || github.actor != vars.COPILOT_BOT_LOGIN }}
    uses: $/.github/workflows/copilot_comment_runtime.yml
    permissions:
      checks: write
      contents: read
    with:
      runs-on: '["self-hosted","codex","Linux"]'
      issue-managed-branches: 'true'
      pre-branch-sdd: 'true'
      ai-ignore-files: build/*,specs/CATALOG.md
      prepare-source-verification: true
    secrets:
      PAT: ${{ secrets.PAT }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
