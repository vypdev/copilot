      - name: Continue repository verification 12
        id: verification_continue_12
        if: ${{ always() && steps.verification_continue_11.outputs.verification-setup-pending == 'true' }}
        uses: ./
        with: *copilot-inputs
        env:
          COPILOT_NATIVE_PHASE: continue
          COPILOT_NATIVE_TICKET: ${{ steps.copilot.outputs.verification-ticket }}
          COPILOT_NATIVE_REQUEST: ${{ steps.verification_continue_11.outputs.verification-request }}
          COPILOT_NATIVE_OUTCOME: ${{ steps.verification_setup_12.outcome }}
      - name: Prepare repository verification 13
        id: verification_setup_13
        if: ${{ !cancelled() && steps.verification_continue_12.outcome == 'success' && steps.verification_continue_12.outputs.verification-setup-pending == 'true' }}
        uses: ./.github/actions/copilot-verification-setup
        timeout-minutes: 5
        env:
          HOME: ${{ steps.verification_continue_12.outputs.verification-home }}
