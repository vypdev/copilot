name: CI Check

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ci-check:
    name: CI Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Contract tests inspect the immutable in-repository action revision
          # used by distributed workflows, so its commit must be available.
          fetch-depth: 0

      - name: Set up pnpm
        # Avoid the standalone @pnpm/exe binary, which has no working Intel
        # macOS build for this pnpm line.
        uses: pnpm/action-setup@v5
        with:
          version: 10.12.4
          standalone: false
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: pnpm


      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate generated guidance checkout
        run: |
          git ls-files --eol -- .copilot/repository-profile.json .copilot/AGENT_GUIDE.md .agents/skills/copilot-repository-workflow/SKILL.md
          pnpm run validate:agent-docs

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Build
        run: pnpm run build

      # Checked-in ncc bundles are generated on Unix; Windows output differs.
      - name: Validate generated bundles
        if: runner.os != 'Windows'
        run: pnpm run validate:build

      - name: Validate npm package contents
        run: pnpm run validate:npm-package

      - name: Smoke test npm package
        run: pnpm run smoke:npm-package

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Validate Bugbot quality benchmark
        run: pnpm run eval:bugbot

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        # Coverage reporting is advisory; Codecov v6 requires gpg even when
        # fail_ci_if_error is false, and the internal macOS runner may not have it.
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Lint
        run: pnpm run lint

      - name: Validate documentation
        run: pnpm run validate:agent-docs

      - name: Validate documentation assets
        run: pnpm run validate:docs-page

      - name: Validate documentation contract
        run: pnpm run validate:documentation

      - name: Validate workflow contract
        run: pnpm run validate:workflows

      - name: Validate product specification catalog
        run: pnpm run validate:specifications

      - name: Validate setup acceptance ledger
        run: pnpm run validate:setup-acceptance

      - name: Validate Git diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            merge_group) base="$MERGE_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            workflow_dispatch) base="$(git rev-parse HEAD^)" ;;
            *) echo "Unsupported diff-check event" >&2; exit 1 ;;
          esac
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "Missing diff-check base commit" >&2; exit 1; }
          git -c core.whitespace=cr-at-eol diff --check "$base" HEAD -- . ':(exclude)build/**'
