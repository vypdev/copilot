name: CI Check

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-check:
    name: CI Check
    runs-on: [self-hosted, codex]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        # Avoid the standalone @pnpm/exe binary, which has no working Intel
        # macOS build for this pnpm line.
        uses: pnpm/action-setup@v5
        with:
          version: 10.12.4
          standalone: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: pnpm


      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Build
        run: pnpm run build

      - name: Validate generated bundles
        run: pnpm run validate:build

      - name: Validate npm package contents
        run: pnpm run validate:npm-package

      - name: Smoke test npm package
        run: pnpm run smoke:npm-package

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        # Coverage reporting is advisory; Codecov v6 requires gpg even when
        # fail_ci_if_error is false, and the internal macOS runner may not have it.
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Lint
        run: pnpm run lint

      - name: Validate documentation
        run: pnpm run validate:agent-docs

      - name: Validate documentation assets
        run: pnpm run validate:docs-page

      - name: Validate workflow contract
        run: pnpm run validate:workflows

      - name: Validate Git diff
        run: git diff --check
