name: Copilot - Commit

on:
  push:
    branches:
      - '**'
      - '!master'
      - '!develop'

jobs:
  copilot-commits:
    name: Copilot - Commit
    runs-on: [self-hosted, X64, Linux, coolify]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - uses: ./
        with:
          debug: ${{ vars.DEBUG }}
          project-ids: ${{ vars.PROJECT_IDS }}
          opencode-model: ${{ vars.OPENCODE_MODEL }}
          token: ${{ secrets.PAT }}
