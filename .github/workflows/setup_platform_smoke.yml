name: Setup Platform Smoke

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  setup-platform-smoke:
    name: Setup package and local session (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.4
          standalone: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: pnpm
      - name: Verify Windows job Node npm CLI
        if: runner.os == 'Windows'
        run: node scripts/verify-windows-job-npm.cjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Checked-in ncc bundles are generated on Unix; Windows output differs.
      - if: runner.os != 'Windows'
        run: pnpm run validate:build
      - run: pnpm run typecheck
      - name: Local setup fixtures only
        run: pnpm exec jest src/application/usecases/setup/__tests__/setup_session_coordinator.test.ts src/cli/__tests__/web_setup_server.test.ts src/cli/__tests__/setup_session_guard.test.ts src/cli/__tests__/setup_apply_snapshot.test.ts src/tooling/__tests__/setup_acceptance_path.test.ts --runInBand --silent
      - name: Isolated agent runtime fixtures
        run: pnpm exec jest src/infrastructure/agents/__tests__/agent_executable_file.test.ts src/infrastructure/agents/__tests__/agent_executable_invocation.test.ts src/infrastructure/agents/__tests__/agent_execution_planner.test.ts src/infrastructure/agents/__tests__/agent_windows_runtime.test.ts --runInBand --silent
      - name: Isolated npm package checks
        run: pnpm run validate:npm-package && pnpm run smoke:npm-package
      - name: Full Windows coverage and acceptance budgets
        if: runner.os == 'Windows'
        run: pnpm run test:coverage
      - name: Upload Windows coverage to Codecov
        if: ${{ runner.os == 'Windows' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          flags: windows
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Full Windows documentation and contract validators
        if: runner.os == 'Windows'
        run: |
          pnpm run validate:agent-docs
          pnpm run validate:docs-page
          pnpm run validate:documentation
          pnpm run validate:workflows
          pnpm run validate:specifications
          pnpm run validate:setup-acceptance
          git -c core.whitespace=cr-at-eol diff --check -- . ':(exclude)build/**'

  setup-windows-codex-smoke:
    if: github.event_name == 'workflow_dispatch'
    name: Setup package and local session (self-hosted Windows codex)
    runs-on: [self-hosted, codex, Windows]
    timeout-minutes: 20
    steps:
      - name: Git Bash in runner service PATH
        run: where.exe bash && bash --version
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.4
          standalone: false
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: pnpm
      - name: Verify Windows job Node npm CLI
        run: node scripts/verify-windows-job-npm.cjs
      - run: pnpm install --frozen-lockfile
      - name: Validate generated guidance checkout on codex Windows
        run: |
          git ls-files --eol -- .copilot/repository-profile.json .copilot/AGENT_GUIDE.md .agents/skills/copilot-repository-workflow/SKILL.md
          pnpm run validate:agent-docs
      - run: pnpm run build
      - run: pnpm run typecheck
      - name: Local setup fixtures only
        run: pnpm exec jest src/application/usecases/setup/__tests__/setup_session_coordinator.test.ts src/cli/__tests__/web_setup_server.test.ts src/cli/__tests__/setup_session_guard.test.ts src/cli/__tests__/setup_apply_snapshot.test.ts src/tooling/__tests__/setup_acceptance_path.test.ts --runInBand --silent
      - name: Isolated agent runtime fixtures
        run: pnpm exec jest src/infrastructure/agents/__tests__/agent_executable_file.test.ts src/infrastructure/agents/__tests__/agent_executable_invocation.test.ts src/infrastructure/agents/__tests__/agent_execution_planner.test.ts src/infrastructure/agents/__tests__/agent_windows_runtime.test.ts --runInBand --silent
      - name: Isolated npm package checks
        run: pnpm run validate:npm-package && pnpm run smoke:npm-package
      - name: Full Windows coverage and acceptance budgets
        run: pnpm run test:coverage
      - name: Full Windows documentation and contract validators
        run: |
          pnpm run validate:agent-docs
          pnpm run validate:docs-page
          pnpm run validate:documentation
          pnpm run validate:workflows
          pnpm run validate:specifications
          pnpm run validate:setup-acceptance
          git -c core.whitespace=cr-at-eol diff --check -- . ':(exclude)build/**'
