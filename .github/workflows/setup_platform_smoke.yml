        run: node scripts/prepare-native-source-action.cjs --fixture
      - name: Prepare native verification acceptance
        id: copilot_native_fixture
        uses: ./../.copilot-native-fixture-runtime
        with: &native-fixture-inputs
          verification-setup: 'true'
        env:
          COPILOT_NATIVE_PHASE: prepare
          COPILOT_NATIVE_RUNTIME_CACHE: ${{ steps.prepare_native_fixture_runtime.outputs.path }}
