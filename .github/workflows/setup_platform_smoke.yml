name: Setup Platform Smoke

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      upload_windows_coverage:
        description: Export hosted Windows coverage to Codecov
        type: boolean
        default: false
      windows_startup_probe:
        description: Compare isolated Windows PowerShell startup with the runner baseline
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  windows-startup-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_startup_probe == true }}
    name: Windows PowerShell startup evidence
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Compare bounded startup probes without exposing process data
        run: node scripts/diagnose-windows-powershell-startup.cjs

  setup-platform-smoke:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.windows_startup_probe != true || inputs.upload_windows_coverage == true)) }}
    name: Setup package and local session (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.4
          standalone: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: pnpm
      - name: Verify Windows job Node npm CLI
        if: runner.os == 'Windows'
        run: node scripts/verify-windows-job-npm.cjs
      - run: pnpm install --frozen-lockfile
      - name: Register native post cleanup acceptance
        uses: ./.github/actions/copilot-native-cleanup-check
      - name: Build native verification acceptance fixture
        run: pnpm exec ncc build src/tooling/__tests__/fixtures/verification_native_fixture.ts -o .github/actions/copilot-native-fixture/dist
      - name: Snapshot native fixture runtime
        id: prepare_native_fixture_runtime
        run: node scripts/prepare-native-source-action.cjs --fixture
      - name: Prepare native verification acceptance
        id: copilot_native_fixture
        uses: ./../.copilot-native-fixture-runtime
        with: &native-fixture-inputs
          verification-setup: 'true'
        env:
          COPILOT_NATIVE_PHASE: prepare
          COPILOT_NATIVE_RUNTIME_CACHE: ${{ steps.prepare_native_fixture_runtime.outputs.path }}
      - name: Prepare repository verification 1
        id: verification_setup_1
        if: ${{ !cancelled() && steps.copilot_native_fixture.outcome == 'success' && steps.copilot_native_fixture.outputs.verification-setup-pending == 'true' }}
        uses: ./.git/copilot-verification-setup
        timeout-minutes: 5
        env:
          HOME: ${{ steps.copilot_native_fixture.outputs.verification-home }}
          USERPROFILE: ${{ steps.copilot_native_fixture.outputs.verification-userprofile }}
          APPDATA: ${{ steps.copilot_native_fixture.outputs.verification-appdata }}
          LOCALAPPDATA: ${{ steps.copilot_native_fixture.outputs.verification-localappdata }}
          PATH: ${{ steps.copilot_native_fixture.outputs.verification-path }}
          JAVA_HOME: ${{ steps.copilot_native_fixture.outputs.verification-java_home }}
          TMP: ${{ steps.copilot_native_fixture.outputs.verification-tmp }}
          TEMP: ${{ steps.copilot_native_fixture.outputs.verification-temp }}
          TMPDIR: ${{ steps.copilot_native_fixture.outputs.verification-tmpdir }}
      - name: Continue repository verification 1
        id: verification_continue_1
        if: ${{ always() && steps.copilot_native_fixture.outputs.verification-setup-pending == 'true' }}
        uses: ./../.copilot-native-fixture-runtime
        with: *native-fixture-inputs
        env:
          COPILOT_NATIVE_PHASE: continue
          COPILOT_NATIVE_SOURCE: ${{ steps.copilot_native_fixture.outputs.verification-source }}
          COPILOT_NATIVE_DIGEST: ${{ steps.copilot_native_fixture.outputs.verification-digest }}
          COPILOT_NATIVE_GIT: ${{ steps.copilot_native_fixture.outputs.verification-git }}
          COPILOT_NATIVE_TICKET: ${{ steps.copilot_native_fixture.outputs.verification-ticket }}
          COPILOT_NATIVE_REQUEST: ${{ steps.copilot_native_fixture.outputs.verification-request }}
          COPILOT_NATIVE_OUTCOME: ${{ steps.verification_setup_1.outcome }}
