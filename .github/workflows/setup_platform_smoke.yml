  upload-windows-coverage:
    name: Upload hosted Windows coverage to Codecov
    needs: setup-platform-smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_windows_coverage == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download hosted Windows coverage
        uses: actions/download-artifact@v4
        with:
          name: hosted-windows-lcov
          path: coverage-windows
      - name: Upload Windows coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage-windows/lcov.info
          disable_search: true
          fail_ci_if_error: true
          flags: windows
          token: ${{ secrets.CODECOV_TOKEN }}

  setup-self-hosted-codex-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.windows_startup_probe != true }}
    name: Setup package and local session (self-hosted ${{ matrix.platform }} codex)
    runs-on: ${{ matrix.labels }}
    # Maintainer-authorized temporary Ubuntu-only routing while Apple Intel
    # runners are offline. Hosted Ubuntu/Windows/macOS coverage remains required.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Ubuntu
            labels: [self-hosted, codex, Linux]
    steps:
      - name: Identify service runner
        run: echo "Runner $RUNNER_NAME on $RUNNER_OS"
      - name: Verify Ubuntu distribution
        if: runner.os == 'Linux'
        run: . /etc/os-release && test "$ID" = ubuntu
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.4
          standalone: false
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          # Persistent runners already retain their local pnpm store. Avoid a
          # dependency-cache archive after the required validation has passed.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Validate generated guidance checkout on codex runner
        run: |
          git ls-files --eol -- .copilot/repository-profile.json .copilot/AGENT_GUIDE.md .agents/skills/copilot-repository-workflow/SKILL.md
