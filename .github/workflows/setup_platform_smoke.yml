name: Setup Platform Smoke

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  setup-platform-smoke:
    name: Setup package and local session (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.4
          standalone: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Checked-in ncc bundles are generated on Unix; Windows output differs.
      - if: runner.os != 'Windows'
        run: pnpm run validate:build
      - run: pnpm run typecheck
      - name: Local setup fixtures only
        run: pnpm exec jest src/application/usecases/setup/__tests__/setup_session_coordinator.test.ts src/cli/__tests__/web_setup_server.test.ts src/cli/__tests__/setup_session_guard.test.ts src/cli/__tests__/setup_apply_snapshot.test.ts src/tooling/__tests__/setup_acceptance_path.test.ts --runInBand --silent
      - name: Isolated agent runtime fixtures
        run: pnpm exec jest src/infrastructure/agents/__tests__/agent_executable_invocation.test.ts src/infrastructure/agents/__tests__/agent_windows_runtime.test.ts --runInBand --silent
      - name: Isolated npm package checks
        run: pnpm run validate:npm-package && pnpm run smoke:npm-package

  setup-windows-codex-smoke:
    name: Setup package and local session (self-hosted Windows codex)
    runs-on: [self-hosted, codex, Windows]
    timeout-minutes: 20
    steps:
      - name: Git Bash in runner service PATH
        run: where.exe bash && bash --version
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.4
          standalone: false
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck
      - name: Local setup fixtures only
        run: pnpm exec jest src/application/usecases/setup/__tests__/setup_session_coordinator.test.ts src/cli/__tests__/web_setup_server.test.ts src/cli/__tests__/setup_session_guard.test.ts src/cli/__tests__/setup_apply_snapshot.test.ts src/tooling/__tests__/setup_acceptance_path.test.ts --runInBand --silent
      - name: Isolated agent runtime fixtures
        run: pnpm exec jest src/infrastructure/agents/__tests__/agent_executable_invocation.test.ts src/infrastructure/agents/__tests__/agent_windows_runtime.test.ts --runInBand --silent
      - name: Isolated npm package checks
        run: pnpm run validate:npm-package && pnpm run smoke:npm-package
