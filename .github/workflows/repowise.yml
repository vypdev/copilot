name: RepoWise Code Health

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: repowise-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-health:
    name: RepoWise code health
    # A merge group can contain fork code without exposing the originating PR here.
    runs-on: ${{ fromJSON((github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-latest"]' || '["self-hosted","codex","Linux"]') }}
    timeout-minutes: 30
    env:
      REPOWISE_VENV_NAME: repowise-venv-${{ github.run_id }}-${{ github.run_attempt }}-code-health
      REPOWISE_REPORT_NAME: repowise-report-${{ github.run_id }}-${{ github.run_attempt }}-code-health
      REPOWISE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
      REPOWISE_EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Verify Ubuntu runner
        shell: bash
        run: . /etc/os-release && test "$ID" = ubuntu
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.12 for RepoWise
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify isolated Python toolchain
        env:
          PYTHON_BIN: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON_BIN" -c 'import sys; print(f"Using Python {sys.version.split()[0]}")'
          "$PYTHON_BIN" -m ensurepip --version
      - name: Create isolated RepoWise environment
        env:
          PYTHON_BIN: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON_BIN" -m venv "$RUNNER_TEMP/$REPOWISE_VENV_NAME"
      - name: Install RepoWise
        run: |
          "$RUNNER_TEMP/$REPOWISE_VENV_NAME/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            'repowise==0.45.0'
      - name: Generate RepoWise reports
        env:
          REPOWISE_SKIP_EDITOR_SETUP: '1'
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/$REPOWISE_REPORT_NAME"
          repowise_bin="$RUNNER_TEMP/$REPOWISE_VENV_NAME/bin/repowise"
          mkdir -p "$report_dir"
          cleanup() {
            rm -rf .repowise .mcp.json
            rm -f .vscode/mcp.json .vscode/extensions.json
            rmdir .vscode 2>/dev/null || true
          }
          trap cleanup EXIT
          "$repowise_bin" init \
            --no-prose --no-claude-md --no-codex --no-editor-setup \
            --no-onboarding --no-distill-hook --no-workspace . > "$report_dir/index.log"
          "$repowise_bin" health --no-workspace --refactoring-targets --format md . | tee "$report_dir/health.md"
          "$repowise_bin" health --no-workspace --refactoring-targets --format json . > "$report_dir/health.json"
          advisory_scan() {
            local name="$1"
            shift
            if (ulimit -v 2097152; timeout --kill-after=10s 90s "$@") > "$report_dir/$name.json"; then
              printf '%s: complete\n' "$name" >> "$report_dir/advisory-status.txt"
            else
              local status="$?"
              rm -f "$report_dir/$name.json"
              printf '%s: incomplete (exit %s)\n' "$name" "$status" >> "$report_dir/advisory-status.txt"
              echo "::warning::RepoWise $name advisory scan incomplete (exit $status); completed health reports remain available."
            fi
          }
          advisory_scan dead-code "$repowise_bin" dead-code --safe-only --no-workspace --format json .
          if [ "$REPOWISE_EVENT_NAME" = workflow_dispatch ]; then
            echo 'security scope: full reachable history (manual dispatch)' >> "$report_dir/advisory-status.txt"
            advisory_scan security "$repowise_bin" security scan --history --path . --format json
          elif [[ "$REPOWISE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && git cat-file -e "$REPOWISE_BASE_SHA^{commit}" \
            && git merge-base --is-ancestor "$REPOWISE_BASE_SHA" HEAD; then
            printf 'security scope: %s..%s\n' "$REPOWISE_BASE_SHA" "$(git rev-parse HEAD)" >> "$report_dir/advisory-status.txt"
            advisory_scan security "$repowise_bin" security scan --history --since "$REPOWISE_BASE_SHA" --to HEAD --path . --format json
          else
            echo 'security: incomplete (event base unavailable or not an ancestor)' >> "$report_dir/advisory-status.txt"
            echo '::warning::RepoWise security advisory scope could not be verified; no full-history fallback was attempted.'
          fi
          {
            echo '## RepoWise code health'
            echo
            echo 'Advisory reports are retained as workflow artifacts for this commit.'
            echo
            sed -n '1,100p' "$report_dir/health.md"
            echo
            echo '### Advisory scan status'
            cat "$report_dir/advisory-status.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload RepoWise reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: repowise-code-health
          path: ${{ runner.temp }}/${{ env.REPOWISE_REPORT_NAME }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove RepoWise temporary files
        if: ${{ always() }}
        run: rm -rf -- "$RUNNER_TEMP/$REPOWISE_VENV_NAME" "$RUNNER_TEMP/$REPOWISE_REPORT_NAME"
