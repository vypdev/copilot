name: RepoWise Code Health

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: repowise-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-health:
    name: RepoWise code health
    runs-on: [self-hosted, codex]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select system Python
        id: python
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$(command -v python3 || command -v python || true)"
          if [[ -z "$python_bin" ]]; then
            echo "::error::RepoWise requires Python 3.11 or newer on the self-hosted runner."
            exit 1
          fi
          "$python_bin" -c 'import sys; print(f"Using Python {sys.version.split()[0]}"); sys.exit("Python 3.11 or newer is required") if sys.version_info < (3, 11) else None'
          echo "path=$python_bin" >> "$GITHUB_OUTPUT"
      - name: Create isolated RepoWise environment
        env:
          PYTHON_BIN: "${{ steps.python.outputs.path }}"
        run: |
          "$PYTHON_BIN" -m venv "$RUNNER_TEMP/repowise-venv"
      - name: Install RepoWise
        run: |
          "$RUNNER_TEMP/repowise-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            'repowise==0.45.0'
      - name: Generate RepoWise reports
        env:
          REPOWISE_SKIP_EDITOR_SETUP: '1'
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/repowise-report"
          repowise_bin="$RUNNER_TEMP/repowise-venv/bin/repowise"
          mkdir -p "$report_dir"
          cleanup() {
            rm -rf .repowise .mcp.json
            rm -f .vscode/mcp.json .vscode/extensions.json
            rmdir .vscode 2>/dev/null || true
          }
          trap cleanup EXIT
          "$repowise_bin" init \
            --no-prose --no-claude-md --no-codex --no-editor-setup \
            --no-onboarding --no-distill-hook --no-workspace . > "$report_dir/index.log"
          "$repowise_bin" health --no-workspace --refactoring-targets --format md . | tee "$report_dir/health.md"
          "$repowise_bin" health --no-workspace --refactoring-targets --format json . > "$report_dir/health.json"
          "$repowise_bin" dead-code --safe-only --no-workspace --format json . > "$report_dir/dead-code.json" || true
          "$repowise_bin" security scan --history --path . --format json > "$report_dir/security.json" || true
          {
            echo '## RepoWise code health'
            echo
            echo 'Advisory reports are retained as workflow artifacts for this commit.'
            echo
            sed -n '1,100p' "$report_dir/health.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload RepoWise reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: repowise-code-health
          path: ${{ runner.temp }}/repowise-report/
          if-no-files-found: warn
          retention-days: 14
