name: Copilot - Runner diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: [self-hosted, codex, Linux]
    timeout-minutes: 15
    steps:
      - name: Report bounded Linux resource counters
        shell: bash
        run: |
          read_counter() {
            local path="$1" expected="$2" metric value ignored rows=0
            if [[ -r "$path" ]]; then
              while read -r metric value ignored; do
                rows=$((rows + 1))
                if [[ "$metric" == "$expected" && "$value" =~ ^[0-9]{1,15}$ ]]; then
                  printf '%s' "$((10#$value))"
                  return
                fi
                if (( rows >= 512 )); then break; fi
              done < "$path"
            fi
            printf '"unavailable"'
          }
          to_mib() {
            local value="$1"
            if [[ "$value" =~ ^[0-9]{1,15}$ ]]; then printf '%s' "$((value / 1024))"; else printf '"unavailable"'; fi
          }
          cpus=0
          while read -r metric ignored; do
            if [[ "$metric" =~ ^cpu[0-9]+$ ]]; then cpus=$((cpus + 1)); fi
          done < /proc/stat
          limit='"unavailable"'
          if [[ -r /sys/fs/cgroup/memory.max ]]; then
            read -r value < /sys/fs/cgroup/memory.max || true
            if [[ "$value" == max ]]; then limit='"unbounded"'; elif [[ "$value" =~ ^[0-9]{1,15}$ ]]; then limit="$((10#$value))"; fi
          fi
          printf '{"totalMemoryMiB":%s,"availableMemoryMiB":%s,"logicalCpus":%s,"kernelOomKillsSinceBoot":%s,"rootCgroupOomKills":%s,"rootCgroupMemoryLimitBytes":%s}\n' \
            "$(to_mib "$(read_counter /proc/meminfo MemTotal:)")" \
            "$(to_mib "$(read_counter /proc/meminfo MemAvailable:)")" \
            "$cpus" "$(read_counter /proc/vmstat oom_kill)" \
            "$(read_counter /sys/fs/cgroup/memory.events oom_kill)" "$limit"
      - name: Checkout diagnostic source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare diagnostic Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Observe exact Linux sandbox prerequisites
        shell: bash
        run: node scripts/diagnose-linux-sandbox-prerequisites.cjs
      - name: Retain Linux sandbox observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-sandbox-prerequisites
          path: ${{ runner.temp }}/copilot-linux-sandbox-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 1
