name: Copilot - Runner diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: [self-hosted, codex, Linux]
    timeout-minutes: 5
    steps:
      - name: Report bounded Linux resource counters
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const read = path => { try { return fs.readFileSync(path, 'utf8').slice(0, 16384); } catch { return ''; } };
          const count = (text, key) => {
            const match = text.match(new RegExp(`^${key}[ \\t]+([0-9]+)$`, 'm'));
            return match && Number.isSafeInteger(Number(match[1])) ? Number(match[1]) : 'unavailable';
          };
          const limit = read('/sys/fs/cgroup/memory.max').trim();
          console.log(JSON.stringify({
            totalMemoryMiB: Math.floor(os.totalmem() / 1048576),
            freeMemoryMiB: Math.floor(os.freemem() / 1048576),
            logicalCpus: os.cpus().length,
            kernelOomKillsSinceBoot: count(read('/proc/vmstat'), 'oom_kill'),
            cgroupOomKills: count(read('/sys/fs/cgroup/memory.events'), 'oom_kill'),
            cgroupMemoryLimitBytes: limit === 'max' ? 'unbounded' : /^[0-9]{1,15}$/.test(limit) ? Number(limit) : 'unavailable'
          }));
          NODE
      - name: Check tool and sandbox prerequisites
        shell: bash
        run: |
          uname -sr
          for tool in node npm pnpm git bwrap unshare codex; do
            command -v "$tool" || true
          done
          if command -v bwrap >/dev/null; then bwrap --version; fi
          if command -v unshare >/dev/null; then
            unshare --user --map-root-user --net true || true
          fi
          if command -v bwrap >/dev/null; then
            bwrap --unshare-user --unshare-net --ro-bind / / --proc /proc --dev /dev /bin/true || true
            bwrap --unshare-user --uid 0 --gid 0 --unshare-net --ro-bind / / --proc /proc --dev /dev /bin/true || true
          fi
          if command -v codex >/dev/null; then
            codex --version
            echo 'Codex sandbox with an empty command environment'
            codex sandbox --config 'sandbox_mode="read-only"' --config 'shell_environment_policy.inherit="none"' -- /bin/true || true
            echo 'Codex sandbox with only the system executable search path'
            codex sandbox --config 'sandbox_mode="read-only"' --config 'shell_environment_policy.inherit="core"' --config 'shell_environment_policy.ignore_default_excludes=false' --config 'shell_environment_policy.include_only=["PATH"]' -- /bin/true || true
          fi
          for setting in /proc/sys/kernel/unprivileged_userns_clone /proc/sys/kernel/apparmor_restrict_unprivileged_userns; do
            if [ -f "$setting" ]; then echo "$setting: $(cat "$setting")"; fi
          done
  windows:
    runs-on: [self-hosted, codex, Windows]
    timeout-minutes: 5
    steps:
      - name: Check verification tool prerequisites
        shell: bash
        run: |
          for tool in node npm pnpm git; do
            command -v "$tool" || true
          done
