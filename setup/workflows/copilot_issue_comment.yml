          LOCALAPPDATA: ${{ steps.verification_continue_10.outputs.verification-localappdata }}
          PATH: ${{ steps.verification_continue_10.outputs.verification-path }}
          JAVA_HOME: ${{ steps.verification_continue_10.outputs.verification-java_home }}
          TMP: ${{ steps.verification_continue_10.outputs.verification-tmp }}
          TEMP: ${{ steps.verification_continue_10.outputs.verification-temp }}
          TMPDIR: ${{ steps.verification_continue_10.outputs.verification-tmpdir }}
      - name: Continue repository verification 11
        id: verification_continue_11
        if: ${{ always() && steps.verification_continue_10.outputs.verification-setup-pending == 'true' }}
        uses: vypdev/copilot@v3
        with: *copilot-inputs
        env:
          COPILOT_NATIVE_PHASE: continue
          COPILOT_NATIVE_TICKET: ${{ steps.copilot.outputs.verification-ticket }}
          COPILOT_NATIVE_REQUEST: ${{ steps.verification_continue_10.outputs.verification-request }}
          COPILOT_NATIVE_OUTCOME: ${{ steps.verification_setup_11.outcome }}
      - name: Prepare repository verification 12
        id: verification_setup_12
        if: ${{ !cancelled() && steps.verification_continue_11.outcome == 'success' && steps.verification_continue_11.outputs.verification-setup-pending == 'true' }}
        uses: ./.github/actions/copilot-verification-setup
        timeout-minutes: 5
        env:
          HOME: ${{ steps.verification_continue_11.outputs.verification-home }}
          USERPROFILE: ${{ steps.verification_continue_11.outputs.verification-userprofile }}
          APPDATA: ${{ steps.verification_continue_11.outputs.verification-appdata }}
          LOCALAPPDATA: ${{ steps.verification_continue_11.outputs.verification-localappdata }}
          PATH: ${{ steps.verification_continue_11.outputs.verification-path }}
