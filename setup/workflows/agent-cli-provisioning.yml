name: Agent CLI Provisioning Check

on:
  workflow_dispatch:
  workflow_call:

jobs:
  verify-agent-clis:
    name: Verify provisioned agent CLIs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify selected CLI binary and headless contract
        shell: bash
        env:
          AGENT_PROVIDER: ${{ vars.AGENT_PROVIDER || 'codex' }}
          AGENT_COMMAND: ${{ vars.AGENT_COMMAND }}
        run: |
          set -euo pipefail

          if [[ -n "${AGENT_COMMAND// }" ]]; then
            read -r executable _ <<< "$AGENT_COMMAND"
            command -v "$executable"
            echo "Configured agent command: $executable"
          else
            case "$AGENT_PROVIDER" in
              opencode)
                command -v opencode
                opencode --version >/dev/null
                opencode run --help >/dev/null
                ;;
              codex)
                command -v codex
                codex --version >/dev/null
                codex exec --help >/dev/null
                ;;
              cursor)
                command -v agent
                agent --version >/dev/null
                agent --help >/dev/null
                ;;
              *)
                echo "Unsupported AGENT_PROVIDER: $AGENT_PROVIDER" >&2
                exit 1
                ;;
            esac
          fi

          echo "Agent CLI contract passed for $AGENT_PROVIDER."
