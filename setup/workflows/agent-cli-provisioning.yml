name: Agent CLI Provisioning Check

on:
  workflow_dispatch:
  workflow_call:

jobs:
  verify-agent-clis:
    name: Verify provisioned agent CLIs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js 24 for pinned agent installation
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Verify selected CLI binary and headless contract
        shell: bash
        env:
          AGENT_PROVIDER: ${{ vars.AGENT_PROVIDER || 'codex' }}
          FINDINGS_PROVIDER: ${{ vars.FINDINGS_PROVIDER }}
          FIXER_PROVIDER: ${{ vars.FIXER_PROVIDER }}
          PLANNER_PROVIDER: ${{ vars.PLANNER_PROVIDER }}
          REVIEWER_PROVIDER: ${{ vars.REVIEWER_PROVIDER }}
          TESTER_PROVIDER: ${{ vars.TESTER_PROVIDER }}
          AGENT_EXECUTABLE: ${{ vars.AGENT_EXECUTABLE }}
          FINDINGS_EXECUTABLE: ${{ vars.FINDINGS_EXECUTABLE }}
          FIXER_EXECUTABLE: ${{ vars.FIXER_EXECUTABLE }}
          PLANNER_EXECUTABLE: ${{ vars.PLANNER_EXECUTABLE }}
          REVIEWER_EXECUTABLE: ${{ vars.REVIEWER_EXECUTABLE }}
          TESTER_EXECUTABLE: ${{ vars.TESTER_EXECUTABLE }}
        run: |
          set -euo pipefail

          providers=("$AGENT_PROVIDER" "$FINDINGS_PROVIDER" "$FIXER_PROVIDER" "$PLANNER_PROVIDER" "$REVIEWER_PROVIDER" "$TESTER_PROVIDER")
          executables=("$AGENT_EXECUTABLE" "$FINDINGS_EXECUTABLE" "$FIXER_EXECUTABLE" "$PLANNER_EXECUTABLE" "$REVIEWER_EXECUTABLE" "$TESTER_EXECUTABLE")
          checked=""
          for index in "${!providers[@]}"; do
            provider="${providers[$index]}"
            [[ -z "${provider// }" ]] && continue
            case "$provider" in
              opencode) expected_executable=opencode; expected_version=1.18.3 ;;
              codex) expected_executable=codex; expected_version='codex-cli 0.153.4' ;;
              cursor) expected_executable=agent; expected_version='2026.09.10-fd3934a' ;;
              *) echo "Unsupported agent provider: $provider" >&2; exit 1 ;;
            esac
            executable="${executables[$index]:-${AGENT_EXECUTABLE:-$expected_executable}}"
            [[ "${executable##*/}" == "$expected_executable" ]] || { echo "Invalid $provider executable basename." >&2; exit 1; }
            installed=false
            if ! command -v "$executable" >/dev/null 2>&1; then
              [[ "$executable" == "$expected_executable" ]] || { echo "Configured executable is missing: $executable" >&2; exit 1; }
              case "$provider" in
                codex) npm install --global '@openai/codex@0.153.4' ;;
                opencode) npm install --global 'opencode-ai@1.18.3' ;;
                cursor) echo 'Cursor Agent must be preinstalled; no reviewed automatic installer is available.' >&2; exit 1 ;;
              esac
              installed=true
            fi
            actual_version="$($executable --version | head -n 1)"
            [[ -n "${actual_version// }" ]] || { echo "$provider returned empty version output" >&2; exit 1; }
            if [[ "$installed" == true ]]; then
              [[ "$actual_version" == "$expected_version" ]] || { echo "$provider installed version mismatch: expected $expected_version, received $actual_version" >&2; exit 1; }
            fi
            "$executable" --help >/dev/null
            [[ " $checked " == *" $provider "* ]] || checked="$checked $provider"
          done

          echo "Agent CLI contract passed for: $checked."
